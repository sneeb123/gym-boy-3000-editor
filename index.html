<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym-Boy 3000 :: веб-редактор</title>
<style>
:root{
  --bg:#050a05; --panel:#0b160b; --fg:#8cff5e; --dim:#4c9c36; --faint:#35702a;
  --line:#1d4212; --accent:#d9ffb3; --warn:#ffd23e; --err:#ff6b6b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg);
  font:15px/1.5 "Consolas","Courier New",monospace;
  min-height:100vh;
}
/* лёгкие строки развёртки, как на ЭЛТ */
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:99;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.15) 0 1px, transparent 1px 3px);
}
#wrap{max-width:780px;margin:0 auto;padding:0 14px 110px}
#top{
  display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  border-bottom:1px solid var(--line); padding:12px 0 9px; letter-spacing:.09em; flex-wrap:wrap;
}
#top .title b{color:var(--accent)}
#status{color:var(--dim); text-transform:uppercase; font-size:13px}
#status.busy{color:var(--warn); animation:blink 1s steps(2) infinite}
#status.ok{color:var(--fg)}
@keyframes blink{50%{opacity:.25}}
h2{letter-spacing:.12em; font-size:17px; margin:18px 0 8px; color:var(--accent)}
.dim{color:var(--dim)}
.faint{color:var(--faint); font-size:13px}
.panel{border:1px solid var(--line); background:var(--panel); padding:12px 14px; margin:12px 0}
.warn{border:1px solid var(--warn); color:var(--warn); background:rgba(255,210,62,.05); padding:9px 12px; margin:12px 0; font-size:14px}
.errbox{border:1px solid var(--err); color:var(--err); background:rgba(255,107,107,.05); padding:9px 12px; margin:12px 0; display:none}
.errbox.show{display:block}
a{color:var(--accent)}
code{color:var(--accent); background:#020402; padding:0 4px; border:1px solid var(--line)}
.btn{
  display:inline-block; background:transparent; color:var(--fg);
  border:1px solid var(--fg); padding:8px 16px; cursor:pointer;
  font:inherit; letter-spacing:.08em; text-transform:uppercase; text-decoration:none;
}
.btn:hover{background:rgba(140,255,94,.12)}
.btn.primary{background:var(--fg); color:#041704; font-weight:bold}
.btn.primary:hover{background:var(--accent)}
.btn.small{padding:3px 9px; font-size:12px}
.btn.danger{border-color:var(--err); color:var(--err)}
.btn.danger:hover{background:rgba(255,107,107,.12)}
.btn[disabled]{opacity:.4; cursor:default}
input,textarea,select{
  background:#020402; border:1px solid var(--line); color:var(--fg);
  font:inherit; padding:6px 8px; width:100%;
}
input:focus,textarea:focus{outline:none; border-color:var(--fg); box-shadow:0 0 7px rgba(140,255,94,.3)}
input[type=password]{letter-spacing:.14em}
label{display:block; margin:8px 0}
label .lbl{display:block; color:var(--dim); font-size:12px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:3px}
table{border-collapse:collapse; width:100%; margin:8px 0 4px}
th{
  color:var(--dim); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  text-align:left; padding:4px 6px; border:1px solid var(--line); font-weight:normal;
}
td{border:1px solid var(--line); padding:3px 5px; vertical-align:middle}
td.sn{color:var(--dim); text-align:center; width:34px}
td.total{color:var(--accent); white-space:nowrap; text-align:right; min-width:74px}
td input{padding:5px 6px}
td.act{width:34px; text-align:center}
.tbl-scroll{overflow-x:auto}
.card{border:1px solid var(--line); background:var(--panel); padding:10px 12px; margin:14px 0}
.cardhead{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.cardhead b{color:var(--accent); letter-spacing:.08em; font-size:13px}
.cardhead .exname{flex:1; min-width:150px; font-weight:bold}
.cardhead .barw{display:flex; gap:6px; align-items:center; color:var(--dim); font-size:13px; white-space:nowrap}
.cardhead .barw input{width:72px}
.rowflex{display:flex; gap:12px; flex-wrap:wrap}
.rowflex>label{flex:1; min-width:150px}
.savebar{
  position:sticky; bottom:0; background:var(--bg);
  border-top:1px solid var(--line); padding:12px 0; margin-top:16px;
  display:flex; gap:10px; flex-wrap:wrap;
}
#toast{
  position:fixed; top:14px; left:50%; transform:translateX(-50%);
  z-index:200; max-width:92vw; padding:9px 16px; display:none;
  border:1px solid var(--fg); background:var(--panel); color:var(--accent);
  box-shadow:0 0 14px rgba(140,255,94,.25);
}
#toast.err{border-color:var(--err); color:var(--err); box-shadow:0 0 14px rgba(255,107,107,.25)}
.filelist{list-style:none; margin:8px 0 18px; padding:0}
.filelist li{border:1px solid var(--line); margin-top:-1px}
.filelist li:hover{background:rgba(140,255,94,.07); cursor:pointer}
.filelist .frow{padding:9px 12px; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap}
.filelist .fkind{color:var(--accent); letter-spacing:.06em}
.filelist .fmeta{color:var(--dim); font-size:13px}
.filelist .ldel{margin-left:auto; align-self:center}
.sec-hint{color:var(--faint); font-size:12px; margin:14px 0 0; letter-spacing:.05em}
ol{margin:8px 0 14px; padding-left:22px}
ol li{margin:4px 0}
</style>
</head>
<body>
<div id="wrap">
  <header id="top">
    <span class="title"><b>GYM-BOY 3000</b> <span class="dim">::</span> ВЕБ-РЕДАКТОР</span>
    <span id="status">OFFLINE</span>
  </header>
  <main id="app"></main>
</div>
<div id="toast"></div>
<script>
'use strict';

/*
 * Веб-редактор файлов тренировок в приватном облаке Gym-Boy 3000 (GitHub).
 * Один файл, без сборки и зависимостей: таблица вместо JSON, правки коммитятся
 * через Contents API тем же форматом (gymboy-program/1, gymboy-result/1).
 *
 * Вход — fine-grained PAT, вставленный один раз и сохранённый в localStorage.
 * Device flow из браузера невозможен: github.com не отдаёт CORS на /login/*
 * (проверено 2026-10-25: OPTIONS → 404, в ответе нет Access-Control-Allow-Origin).
 * api.github.com при этом отдаёт Access-Control-Allow-Origin: * — обмен работает
 * и со страницы на GitHub Pages, и с локального файла (file://).
 */

const DEFAULT_REPO = 'gymboy-data';
const LS_TOKEN = 'gb3000_web.token';
const LS_REPO  = 'gb3000_web.repo';
// Меняется при каждой публикации. Открытая вчера вкладка живёт со старым кодом
// и ничего о нём не знает — поэтому при загрузке она сверяет APP_VER с живой
// страницей (см. versionCheck перед boot) и перезагружается при расхождении.
const APP_VER = 'v5';

const app = document.getElementById('app');
const statusEl = document.getElementById('status');
const toastEl = document.getElementById('toast');

const state = { token:null, login:null, owner:null, repo:null, isPrivate:null };
let cur = null;           // открытый файл: { path, sha, data, dirty }
let inFlight = false;     // идёт обмен с облаком (защита от параллельных перечитываний)
let toastTimer = null;

/* ── утилиты ─────────────────────────────────────────────────────────── */

function esc(s){
  return String(s ?? '').replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/** '2026-10-25' → '25.10.2026' */
function fmtDate(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
  return m ? `${m[3]}.${m[2]}.${m[1]}` : (iso ? String(iso) : '—');
}

/** Число из ввода: пусто/мусор → null, запятая допустима ('27,5' → 27.5). */
function parseNum(v){
  if (v == null) return null;
  const s = String(v).trim().replace(',', '.');
  if (!s) return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function fmtKg(n){
  return String(Math.round(n * 100) / 100);
}

function b64decode(s){
  const bin = atob(s.replace(/\s+/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function b64encode(s){
  const bytes = new TextEncoder().encode(s);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}

function setStatus(text, cls){
  statusEl.textContent = text;
  statusEl.className = cls || '';
}

function busy(on, label){
  if (on) setStatus('● ' + (label || 'ОБМЕН…'), 'busy');
  else setStatus(state.owner ? `● ${state.owner}/${state.repo}` : '● СВЯЗЬ', 'ok');
}

function toast(msg, kind){
  toastEl.textContent = msg;
  toastEl.className = kind === 'err' ? 'err' : '';
  toastEl.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.style.display = 'none'; }, 4200);
}

function markDirty(){
  if (cur) cur.dirty = true;
}

/* ── GitHub API ──────────────────────────────────────────────────────── */

async function api(method, path, body){
  let res;
  try {
    res = await fetch('https://api.github.com' + path, {
      method,
      headers: {
        'Authorization': 'Bearer ' + state.token,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
      },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) {
    throw new Error('нет связи с api.github.com');
  }
  if (res.status === 401) {
    forgetToken();
    throw new Error('токен недействителен или истёк — войдите заново');
  }
  let json = null;
  try { json = await res.json(); } catch (e) { /* пустое тело — ок */ }
  if (!res.ok) {
    const err = new Error(String(json && json.message || ('HTTP ' + res.status)).slice(0, 140));
    err.status = res.status;
    throw err;
  }
  return json;
}

function forgetToken(){
  state.token = null;
  localStorage.removeItem(LS_TOKEN);
}

/* ── экран входа (PAT) ───────────────────────────────────────────────── */

function showTokenScreen(msg){
  document.title = 'Gym-Boy 3000 :: веб-редактор — вход';
  setStatus('● OFFLINE', '');
  app.innerHTML = `
    <h2>ВХОД</h2>
    <p>Редактор правит файлы тренировок в приватном облачном репозитории
       <code>${esc(DEFAULT_REPO)}</code>. Браузеру нужен токен GitHub — один раз:
       он сохранится в этом браузере и будет уходить только на api.github.com.</p>
    ${msg ? `<p class="errbox show">✕ ${esc(msg)}</p>` : ''}
    <div class="panel">
      <ol>
        <li>Нажмите кнопку — откроется страница токенов GitHub.</li>
        <li><b>Repository access</b> → <i>Only select repositories</i> → выберите
            <code>${esc(DEFAULT_REPO)}</code>.</li>
        <li><b>Permissions → Repository permissions → Contents</b> →
            <i>Read and write</i>. Остальное не нужно.</li>
        <li><b>Generate token</b> — и вставьте строку <code>github_pat_…</code> сюда.</li>
      </ol>
      <a class="btn primary" href="https://github.com/settings/personal-access-tokens/new"
         target="_blank" rel="noopener">Создать токен ↗</a>
      <p><input id="pat" type="password" autocomplete="off" spellcheck="false"
                placeholder="github_pat_… или классический PAT"></p>
      <button id="go" class="btn">Войти</button>
      <details><summary class="dim">Подойдёт и классический PAT</summary>
        <p class="dim">github.com/settings/tokens/new → отметьте <code>repo</code> →
        вставьте в то же поле. Fine-grained лучше: доступ только к одному репозиторию.</p>
      </details>
    </div>`;
  const go = async () => {
    const t = document.getElementById('pat').value.trim();
    if (!t) { toast('вставьте токен', 'err'); return; }
    state.token = t;
    busy(true, 'АВТОРИЗАЦИЯ…');
    try {
      state.login = (await api('GET', '/user')).login;
      localStorage.setItem(LS_TOKEN, t);
      await pickRepo();
    } catch (e) {
      state.token = null;
      busy(false);
      showTokenScreen(e.message);
      return;
    }
    busy(false);
  };
  document.getElementById('go').onclick = go;
  document.getElementById('pat').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

/* ── выбор репозитория ───────────────────────────────────────────────── */

async function pickRepo(){
  const tried = [];
  const saved = localStorage.getItem(LS_REPO);
  if (saved) tried.push(saved);
  tried.push(state.login + '/' + DEFAULT_REPO);
  for (const full of tried) {
    if (await tryRepo(full)) return showFiles();
  }
  await showRepoScreen();
}

/** Проверяет доступ к репо и запоминает; false, если не вышло. */
async function tryRepo(full){
  const parts = full.split('/').filter(Boolean);
  if (parts.length !== 2) return false;
  try {
    const info = await api('GET', `/repos/${parts[0]}/${parts[1]}`);
    state.owner = parts[0];
    state.repo = parts[1];
    state.isPrivate = info.private === true;
    localStorage.setItem(LS_REPO, full);
    return true;
  } catch (e) {
    return false;
  }
}

async function showRepoScreen(prefill){
  busy(true, 'СПИСОК РЕПОЗИТОРИЕВ…');
  let picks = [];
  try {
    picks = (await api('GET', '/user/repos?per_page=100&sort=updated'))
      .map(r => r.full_name).filter(n => /gym/i.test(n)).slice(0, 6);
  } catch (e) { /* без списка — просто ручной ввод */ }
  busy(false);
  app.innerHTML = `
    <h2>РЕПОЗИТОРИЙ ДАННЫХ</h2>
    <p class="dim">Токен действует, но репозиторий <code>${esc(state.login)}/${esc(DEFAULT_REPO)}</code>
    не найден. Укажите, где лежат данные Gym-Boy 3000.</p>
    ${picks.length ? `<p>${picks.map(n =>
      `<button class="btn small pick" data-repo="${esc(n)}">${esc(n)}</button>`).join(' ')}</p>` : ''}
    <div class="panel">
      <label><span class="lbl">владелец / репозиторий</span>
        <input id="rfull" placeholder="${esc(state.login)}/${esc(DEFAULT_REPO)}"
               value="${esc(prefill || '')}"></label>
      <button id="rgo" class="btn">Проверить</button>
    </div>`;
  app.querySelectorAll('.pick').forEach(b => { b.onclick = () => useRepo(b.dataset.repo); });
  const go = () => useRepo(document.getElementById('rfull').value.trim());
  document.getElementById('rgo').onclick = go;
  document.getElementById('rfull').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

async function useRepo(full){
  busy(true, 'ПРОВЕРКА…');
  const ok = await tryRepo(full);
  busy(false);
  if (ok) showFiles();
  else showRepoScreen(full);
}

function publicWarn(){
  return state.isPrivate === false
    ? `<div class="warn">⚠ РЕПОЗИТОРИЙ ПУБЛИЧНЫЙ — данные тренировок видны всему интернету.
       Сделайте его приватным: Settings → General → Danger Zone → Change visibility.
       (Редактор, как и приложение с v0.10.1, только предупреждает — решение за вами.)</div>`
    : '';
}

/* ── список файлов ───────────────────────────────────────────────────── */

const SECTIONS = [
  { dir: 'programs/pending',  kind: 'ПРОГРАММА', title: 'НОВЫЕ ПРОГРАММЫ',
    hint: 'приложение заберёт их при следующем синке и перенесёт в принятые' },
  { dir: 'programs/imported', kind: 'ПРОГРАММА', title: 'ПРИНЯТЫЕ ПРОГРАММЫ', hint: '' },
  { dir: 'results',           kind: 'РЕЗУЛЬТАТ', title: 'РЕЗУЛЬТАТЫ', hint: '' },
];

function commonHead(){
  return `
    <p class="faint">репозиторий: ${esc(state.owner)}/${esc(state.repo)}
      · <a href="#" id="chg">сменить</a>
      · <a href="#" id="out">выйти</a></p>
    ${publicWarn()}`;
}

function bindCommonHead(){
  document.getElementById('chg').onclick = e => { e.preventDefault(); showRepoScreen(); };
  document.getElementById('out').onclick = e => {
    e.preventDefault();
    if (cur && cur.dirty && !confirm('Есть несохранённые правки — выйти всё равно?')) return;
    forgetToken();
    showTokenScreen();
  };
}

/* Метаданные из имени файла — запасной план, если тело прочитать не удалось. */
function metaFromName(name){
  const d = /(\d{4}-\d{2}-\d{2})/.exec(name);
  const n = /(\d+)/.exec(name.replace(/\d{4}-\d{2}-\d{2}/, ''));
  return { date: d ? d[1] : null, workout_number: n ? Number(n[1]) : null };
}

/** Свежайшие сверху: дата ↓, номер ↓, имя ↑. */
function byWorkout(a, b){
  const am = a.meta || {}, bm = b.meta || {};
  return (bm.date || '').localeCompare(am.date || '') ||
         (bm.workout_number || 0) - (am.workout_number || 0) ||
         a.name.localeCompare(b.name);
}

/* Заголовок записи: { head: «ПРОГРАММА 8», rest: « · 25.10.2026 · 2 упр. — заметки» }. */
function entryParts(m, kind, isResult){
  m = m || {};
  const num = m.workout_number != null ? ` ${m.workout_number}` : '';
  const date = m.date ? ` · ${fmtDate(m.date)}` : '';
  const extra = isResult && m.duration_seconds != null
    ? ` · ${Math.round(m.duration_seconds / 60)} мин` : '';
  const exn = Array.isArray(m.exercises) ? ` · ${m.exercises.length} упр.` : '';
  const note = m.notes ? ` — ${String(m.notes).slice(0, 60)}` : '';
  return { head: `${kind}${num}`, rest: `${date}${extra}${exn}${note}` };
}

function sectionHtml(sec, rows){
  const isResult = sec.dir === 'results';
  const items = rows.map(r => {
    const p = entryParts(r.meta, sec.kind, isResult);
    return `<li data-path="${esc(r.path)}">
      <div class="frow"><span class="fkind">${esc(p.head)}</span>
        <span>${esc(p.rest)}</span>
        <button class="btn small danger ldel" data-sha="${esc(r.sha || '')}"
          title="удалить файл из облака (потребует подтверждения)">✕</button></div></li>`;
  }).join('');
  return `<h2>${sec.title}</h2>
    ${sec.hint ? `<p class="sec-hint">${sec.hint}</p>` : ''}
    ${items ? `<ul class="filelist">${items}</ul>`
            : `<p class="faint">— пусто</p>`}`;
}

/*
 * Содержимое файлов в листинге папки НЕ приходит (тот же глюк, что ловило
 * приложение в октябре: GET папки отдаёт только имена) — поэтому каждая
 * тренировка дочитывается отдельным запросом: из неё берутся номер, дата,
 * длительность и заметки. Запросов немного, идёт по 6 одновременно.
 */
async function fetchRows(sec, files){
  const rows = [];
  let done = 0;
  const queue = files.slice();
  await Promise.all(Array.from({ length: Math.min(6, queue.length) || 1 }, async () => {
    while (queue.length) {
      const f = queue.shift();
      let meta = null;
      let sha = f.sha;    // sha уже приходит в листинге папки; дочитывание подтвердит/обновит
      try {
        const full = await api('GET', `/repos/${state.owner}/${state.repo}/contents/${f.path}`);
        meta = JSON.parse(b64decode(full.content));
        sha = full.sha;
      } catch (e) {
        meta = metaFromName(f.name);
      }
      rows.push({ name: f.name, path: f.path, meta, kind: sec.kind, sha });
      busy(true, `ЧТЕНИЕ ${++done}/${files.length}…`);
    }
  }));
  rows.sort(byWorkout);
  return rows;
}

async function showFiles(opts){
  const quiet = !!(opts && opts.quiet); // фоновая сверка: молча, не трогая экран
  if (inFlight) return;
  inFlight = true;
  try {
    cur = null;
    document.title = 'Gym-Boy 3000 :: веб-редактор — файлы';
    if (!quiet) busy(true, 'ЗАПРОС РЕПОЗИТОРИЯ…');
    const sectionsRows = [];
    let fatal = null;
    // Сначала корень репозитория: узнаём, какие папки вообще есть, и не
    // запрашиваем отсутствующие. Списку их 404 и не мешали (папка ещё не
    // создана синком приложения), но красные строки в консоли выглядят
    // как поломка.
    let rootNames = null;
    try {
      const root = await api('GET', `/repos/${state.owner}/${state.repo}/contents/`);
      rootNames = new Set((Array.isArray(root) ? root : []).map(x => x.name));
    } catch (e) {
      if (e.status !== 404) { busy(false); if (!quiet) renderFiles([], e); return; }
      rootNames = new Set();               // репозиторий ещё пустой
    }
    const parentNames = {};
    for (const sec of SECTIONS) {
      const parts = sec.dir.split('/');
      let exists = rootNames.has(parts[0]);
      if (exists && parts.length > 1) {
        if (!parentNames[parts[0]]) {
          try {
            const ls = await api('GET', `/repos/${state.owner}/${state.repo}/contents/${parts[0]}`);
            parentNames[parts[0]] = new Set((Array.isArray(ls) ? ls : []).map(x => x.name));
          } catch (e) {
            if (e.status === 404) parentNames[parts[0]] = new Set();
            else { fatal = e; break; }
          }
        }
        exists = parentNames[parts[0]].has(parts[1]);
      }
      if (!exists) continue;               // папки ещё нет — пропустить, как в приложении
      let items;
      try {
        items = await api('GET', `/repos/${state.owner}/${state.repo}/contents/${sec.dir}`);
      } catch (e) {
        if (e.status === 404) continue;    // исчезла между проверками — пропустить
        fatal = e;
        break;
      }
      const files = (Array.isArray(items) ? items : []).filter(f => f.name.endsWith('.json'));
      let rows;
      try {
        rows = await fetchRows(sec, files);
      } catch (e) {
        // список важнее точных меток: упало чтение содержимого — показать хотя бы имена
        rows = files.map(f => ({ name: f.name, path: f.path,
          meta: metaFromName(f.name), kind: sec.kind, sha: f.sha }));
      }
      sectionsRows.push({ sec, rows });
    }
    busy(false);
    // при тихой сверке ошибки сети не должны стирать текущий список
    if (!(fatal && quiet)) renderFiles(sectionsRows, fatal);
  } finally {
    inFlight = false;
  }
}

function renderFiles(sectionsRows, fatal){
  const allRows = sectionsRows.flatMap(s => s.rows);
  document.title = 'Gym-Boy 3000 :: веб-редактор — файлы';
  app.innerHTML = commonHead() + (fatal
    ? `<div class="errbox show">✕ ${esc(fatal.message)}
         <br><button class="btn small" id="retry">Повторить</button></div>`
    : `<p><button id="neww" class="btn primary">+ новая тренировка</button></p>`
      + (sectionsRows.map(({sec, rows}) => sectionHtml(sec, rows)).join('')
         || `<p class="dim">В репозитории пока нет папок с данными.
              Они появятся после первого синка из приложения — или создайте
              первую тренировку кнопкой выше.</p>`)
  ) + `<p class="faint">файл правится прямо в облаке: приложение подхватит
      изменения при следующей синхронизации.</p>`;
  bindCommonHead();
  const retry = document.getElementById('retry');
  if (retry) retry.onclick = showFiles;
  const neww = document.getElementById('neww');
  if (neww) neww.onclick = () => showNewWorkout(allRows);
  app.querySelectorAll('li[data-path]').forEach(li => {
    li.onclick = () => openEditor(li.dataset.path);
  });
  app.querySelectorAll('.ldel').forEach(b => {
    b.onclick = e => { e.stopPropagation(); listDelete(b); };
  });
}

/* ── новая тренировка ────────────────────────────────────────────────── */

function todayIso(){
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
}

/** Новая программа: копия базы, очищенная от результатов, + свежие номер и дата. */
function buildNewProgram(base, allRows){
  let d;
  if (base && typeof base === 'object') d = JSON.parse(JSON.stringify(base));
  else d = { notes: null, exercises: [] };
  d.schema = 'gymboy-program/1';
  delete d.started_at;
  delete d.finished_at;
  delete d.duration_seconds;
  d.exercises = Array.isArray(d.exercises) ? d.exercises : [];
  if (!d.exercises.length) d.exercises.push(newExercise(8));
  d.exercises.forEach(ex => {
    ex.sets = Array.isArray(ex.sets) ? ex.sets : [];
    ex.sets.forEach(s => { s.actual_reps = null; s.pulse = null; });
  });
  const maxNum = allRows.reduce(
    (mx, r) => Math.max(mx, (r.meta && r.meta.workout_number) || 0), 0);
  d.workout_number = maxNum + 1;
  d.date = todayIso();
  return d;
}

function startNewProgram(base, allRows){
  cur = { path: null, sha: null, isNew: true, dirty: true,
          data: buildNewProgram(base, allRows) };
  renderEditor();
}

function showNewWorkout(allRows){
  document.title = 'Gym-Boy 3000 :: веб-редактор — новая тренировка';
  const options = allRows.map((r, i) => {
    const p = entryParts(r.meta, r.kind, String(r.kind).includes('РЕЗУЛЬТАТ'));
    return `<option value="${i}">${esc(p.head + p.rest)}</option>`;
  }).join('');
  app.innerHTML = commonHead() + `
    <p><a href="#" id="back">← к файлам</a></p>
    <h2>НОВАЯ ТРЕНИРОВКА</h2>
    <div class="panel">
      <label><span class="lbl">взять за основу</span>
        <select id="base">
          <option value="-1">— с нуля (пустая таблица)</option>
          ${options}
        </select></label>
      <p class="faint">скопируются упражнения, веса и плановые повторения;
      факт и пульс очистятся, номер и дата поставятся новые.
      Новый файл уйдёт в <code>programs/pending</code> — телефон заберёт его при синке.</p>
      <button id="create" class="btn primary">Создать</button>
    </div>`;
  bindCommonHead();
  document.getElementById('back').onclick = e => { e.preventDefault(); showFiles(); };
  document.getElementById('create').onclick = () => {
    const v = document.getElementById('base').value;
    const base = v === '-1' ? null : allRows[Number(v)].meta;
    startNewProgram(base, allRows);
  };
}

/* ── редактор ────────────────────────────────────────────────────────── */

function newSet(){
  return { set_number: null, plates_weight_kg: null, total_weight_kg: null,
           planned_reps: null, actual_reps: null, pulse: null };
}

function newExercise(bar){
  return { name: '', bar_weight_kg: bar ?? 8, notes: null, sets: [newSet(), newSet(), newSet()] };
}

async function openEditor(path){
  busy(true, 'ЗАГРУЗКА ФАЙЛА…');
  try {
    const f = await api('GET', `/repos/${state.owner}/${state.repo}/contents/${path}`);
    let data;
    try { data = JSON.parse(b64decode(f.content)); }
    catch (e) {
      busy(false);
      toast('файл не является корректным JSON', 'err');
      return;
    }
    data.exercises = Array.isArray(data.exercises) ? data.exercises : [];
    data.exercises.forEach(ex => { ex.sets = Array.isArray(ex.sets) ? ex.sets : []; });
    cur = { path, sha: f.sha, data, dirty: false };
    renderEditor();
  } catch (e) {
    toast('не удалось открыть: ' + e.message, 'err');
  }
  busy(false);
}

function renderEditor(){
  document.title = 'Gym-Boy 3000 :: веб-редактор — правка';
  const d = cur.data;
  const isResult = String(d.schema || '').includes('result');
  const badSchema = d.schema && !String(d.schema).startsWith('gymboy-');
  const times = (d.started_at || d.finished_at)
    ? `<p class="faint">тренировка: ${esc(fmtDate(d.started_at))} — ${esc(d.finished_at || '')},
         ${esc(d.duration_seconds != null ? Math.round(d.duration_seconds / 60) + ' мин' : '')}</p>`
    : '';
  app.innerHTML = `
    <p><a href="#" id="back">← к файлам</a>
       <span class="faint"> · ${cur.isNew ? 'новая программа → programs/pending' : esc(cur.path)}</span></p>
    ${publicWarn()}
    ${badSchema ? `<div class="warn">⚠ неизвестная схема «${esc(d.schema)}» — правки могут её исказить</div>` : ''}
    ${times}
    <div class="panel">
      <div class="rowflex">
        <label><span class="lbl">тренировка №</span>
          <input id="wnum" type="number" inputmode="numeric" value="${esc(d.workout_number ?? '')}"></label>
        <label><span class="lbl">дата</span>
          <input id="wdate" type="date" value="${esc(d.date || '')}"></label>
      </div>
      <label><span class="lbl">${isResult ? 'заметки' : 'план / заметки'}</span>
        <textarea id="wnotes" rows="2">${esc(d.notes || '')}</textarea></label>
    </div>
    <div id="exercises"></div>
    <button id="addex" class="btn">+ упражнение</button>
    <div class="errbox" id="errbox"></div>
    <div class="savebar">
      <button id="save" class="btn primary">Сохранить в облако</button>
      <button id="cancel" class="btn">Отмена</button>
      ${cur.isNew ? '' : `<button id="del" class="btn danger" title="удалить файл из облака (потребует подтверждения)">удалить</button>`}
      <span class="faint" id="savehint"></span>
    </div>`;
  document.getElementById('wnum').oninput = e => { d.workout_number = parseNum(e.target.value); markDirty(); };
  document.getElementById('wdate').oninput = e => { d.date = e.target.value; markDirty(); };
  document.getElementById('wnotes').oninput = e => { d.notes = e.target.value; markDirty(); };
  document.getElementById('addex').onclick = () => {
    const exs = d.exercises;
    exs.push(newExercise(parseNum(exs[exs.length - 1]?.bar_weight_kg)));
    markDirty();
    renderEditor();
  };
  document.getElementById('save').onclick = saveFile;
  const del = document.getElementById('del');
  if (del) del.onclick = deleteFile;
  document.getElementById('cancel').onclick = () => {
    if (cur.dirty && !confirm('Закрыть без сохранения?')) return;
    showFiles();
  };
  document.getElementById('back').onclick = e => {
    e.preventDefault();
    if (cur.dirty && !confirm('Есть несохранённые правки — уйти всё равно?')) return;
    showFiles();
  };
  renderExercises();
}

function exerciseHtml(ex, i){
  const rows = ex.sets.map((s, j) => {
    const total = parseNum(s.plates_weight_kg);
    const bar = parseNum(ex.bar_weight_kg);
    const tot = total == null ? '—' : fmtKg(total + (bar ?? 0));
    return `<tr>
      <td class="sn">${j + 1}</td>
      <td><input class="s-plates" inputmode="decimal" value="${esc(s.plates_weight_kg ?? '')}"></td>
      <td class="total">${esc(tot)}</td>
      <td><input class="s-plan" inputmode="numeric" value="${esc(s.planned_reps ?? '')}"></td>
      <td><input class="s-act" inputmode="numeric" value="${esc(s.actual_reps ?? '')}"></td>
      <td><input class="s-pulse" inputmode="numeric" value="${esc(s.pulse ?? '')}"></td>
      <td class="act"><button class="btn small danger s-del" title="убрать подход">✕</button></td>
    </tr>`;
  }).join('');
  return `<div class="card" data-ex="${i}">
    <div class="cardhead">
      <b>УПРАЖНЕНИЕ ${i + 1}</b>
      <input class="exname" value="${esc(ex.name || '')}" placeholder="название упражнения">
      <span class="barw"><span>гриф</span>
        <input class="exbar" inputmode="decimal" value="${esc(ex.bar_weight_kg ?? '')}"><span>кг</span></span>
      <button class="btn small danger del" title="убрать упражнение">✕</button>
    </div>
    <input class="exnotes" value="${esc(ex.notes || '')}" placeholder="заметки (темп, 1RM, …)">
    <div class="tbl-scroll"><table>
      <thead><tr><th>№</th><th>блины, кг</th><th>итого, кг</th><th>план</th><th>факт</th><th>пульс</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <button class="btn small addset">+ подход</button>
  </div>`;
}

function renderExercises(){
  const box = document.getElementById('exercises');
  const exs = cur.data.exercises;
  box.innerHTML = exs.map(exerciseHtml).join('') ||
    `<p class="dim">Упражнений нет — добавьте первое кнопкой ниже.</p>`;
  exs.forEach((ex, i) => {
    const card = box.querySelector(`[data-ex="${i}"]`);
    card.querySelector('.exname').oninput = e => { ex.name = e.target.value; markDirty(); };
    card.querySelector('.exbar').oninput = e => { ex.bar_weight_kg = parseNum(e.target.value); markDirty(); updateTotals(i); };
    card.querySelector('.exnotes').oninput = e => { ex.notes = e.target.value; markDirty(); };
    card.querySelector('.del').onclick = () => {
      if (!confirm(`Убрать упражнение «${ex.name || i + 1}»?`)) return;
      cur.data.exercises.splice(i, 1);
      markDirty();
      renderEditor();
    };
    const tbody = card.querySelector('tbody');
    ex.sets.forEach((s, j) => {
      const row = tbody.rows[j];
      const bind = (cls, key) => {
        row.querySelector('.' + cls).oninput = e => {
          s[key] = parseNum(e.target.value);
          markDirty();
          if (key === 'plates_weight_kg') updateTotals(i);
        };
      };
      bind('s-plates', 'plates_weight_kg');
      bind('s-plan', 'planned_reps');
      bind('s-act', 'actual_reps');
      bind('s-pulse', 'pulse');
      row.querySelector('.s-del').onclick = () => {
        ex.sets.splice(j, 1);
        markDirty();
        renderEditor();
      };
    });
    card.querySelector('.addset').onclick = () => {
      ex.sets.push(newSet());
      markDirty();
      renderEditor();
    };
  });
}

/** «итого» пересчитывается на лету: блины + гриф */
function updateTotals(i){
  const card = document.querySelector(`[data-ex="${i}"]`);
  if (!card) return;
  const ex = cur.data.exercises[i];
  const bar = parseNum(ex.bar_weight_kg) ?? 0;
  ex.sets.forEach((s, j) => {
    const cell = card.querySelector('tbody').rows[j]?.querySelector('.total');
    if (!cell) return;
    const p = parseNum(s.plates_weight_kg);
    cell.textContent = p == null ? '—' : fmtKg(p + bar);
  });
}

function validate(){
  const errs = [];
  const d = cur.data;
  if (d.workout_number == null) errs.push('не указан номер тренировки');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date || '')) errs.push('дата не указана или не ГГГГ-ММ-ДД');
  if (!d.exercises.length) errs.push('в тренировке нет упражнений');
  d.exercises.forEach((ex, i) => {
    const en = `упражнение ${i + 1}${ex.name ? ` «${ex.name}»` : ''}`;
    if (!String(ex.name || '').trim()) errs.push(`${en}: нет названия`);
    if (parseNum(ex.bar_weight_kg) == null) errs.push(`${en}: не указан вес грифа`);
    if (!ex.sets.length) errs.push(`${en}: нет подходов`);
    ex.sets.forEach((s, j) => {
      if (parseNum(s.plates_weight_kg) == null) errs.push(`${en}, подход ${j + 1}: не указан вес блинов`);
      if (s.planned_reps == null) errs.push(`${en}, подход ${j + 1}: не указаны плановые повторения`);
    });
  });
  return errs;
}

/** Приводит подходы к каноническому виду (нумерация, итого = блины + гриф). */
function serialize(){
  const d = cur.data;
  d.exercises.forEach(ex => {
    const bar = parseNum(ex.bar_weight_kg) ?? 0;
    ex.sets.forEach((s, j) => {
      s.set_number = j + 1;
      const plates = parseNum(s.plates_weight_kg);
      s.plates_weight_kg = plates;
      s.total_weight_kg = Math.round((plates + bar) * 100) / 100;
    });
    if (!String(ex.notes || '').trim()) ex.notes = null;
  });
  return JSON.stringify(d, null, 2) + '\n';
}

async function saveFile(){
  const box = document.getElementById('errbox');
  const errs = validate();
  if (errs.length) {
    box.innerHTML = errs.map(e => `<div>✕ ${esc(e)}</div>`).join('');
    box.classList.add('show');
    return;
  }
  box.classList.remove('show');
  const saveBtn = document.getElementById('save');
  if (saveBtn.disabled) return;          // уже пишем — повторный клик игнорируем
  saveBtn.disabled = true;
  if (cur.isNew) {
    // имя нового файла строится из актуальных номера и даты
    cur.path = `programs/pending/program-${cur.data.workout_number}-${cur.data.date}.json`;
  }
  busy(true, 'ЗАПИСЬ…');
  try {
    const res = await api('PUT',
      `/repos/${state.owner}/${state.repo}/contents/${cur.path}`, {
        message: cur.isNew
          ? `Gym-Boy 3000: новая программа — ${cur.path.split('/').pop()}`
          : `Gym-Boy 3000: правка в веб-редакторе — ${cur.path.split('/').pop()}`,
        content: b64encode(serialize()),
        sha: cur.sha || undefined,
      });
    cur.sha = res.content.sha;
    const wasNew = cur.isNew;
    cur.isNew = false;
    cur.dirty = false;
    document.getElementById('savehint').textContent =
      (wasNew ? `сохранено в ${cur.path} · ` : 'сохранено ') +
      new Date().toLocaleTimeString('ru-RU');
    toast('✔ СОХРАНЕНО — файл записан в облако');
  } catch (e) {
    if (e.status === 409 || (e.status === 422 && /sha/i.test(e.message))) {
      if (cur.isNew) {
        box.innerHTML = `<div>⚠ программа с таким номером и датой уже есть
          (${esc(cur.path)}). Поменяйте номер или дату наверху — либо откройте
          существующий файл из списка.</div>`;
        box.classList.add('show');
      } else {
        box.innerHTML = `<div>⚠ файл в облаке изменился с момента открытия.</div>
          <button class="btn small" id="reload">Перечитать из облака (правки будут потеряны)</button>`;
        box.classList.add('show');
        document.getElementById('reload').onclick = () => openEditor(cur.path);
      }
    } else {
      toast('не сохранено: ' + e.message, 'err');
    }
  }
  saveBtn.disabled = false;
  busy(false);
}

/* Общее ядро удаления: без sha — сначала читаем файл ради актуального sha.
   404 не ошибка: файл мог уже исчезнуть (удалён из другой вкладки или с
   телефона, а у нас устаревший список) — считаем «уже удалено» и успешно
   перечитываем список, чтобы строка-призрак исчезла. 409 — файл пересоздавали
   (устаревший sha из списка): перечитываем sha и пробуем ещё раз, как в приложении. */
async function deleteByPath(path, sha){
  for (let attempt = 0; attempt < 2; attempt++) {
    let s = sha;
    if (!s) {
      try {
        const f = await api('GET', `/repos/${state.owner}/${state.repo}/contents/${path}`);
        s = f.sha;
      } catch (e) {
        if (e.status === 404) return;
        throw e;
      }
    }
    try {
      await api('DELETE', `/repos/${state.owner}/${state.repo}/contents/${path}`, {
        message: `Gym-Boy 3000: удаление — ${path.split('/').pop()}`,
        sha: s,
      });
      return;
    } catch (e) {
      if (e.status === 404) return;   // удалили раньше нас — цель достигнута
      if (e.status === 409 && attempt === 0) { sha = null; continue; }
      throw e;
    }
  }
}

/* Удаление записи: первый клик — предупреждение, второй (в течение 6 с) — удаление. */
async function deleteFile(){
  const btn = document.getElementById('del');
  if (!btn || cur.isNew) return;
  if (!btn.dataset.armed) {
    btn.dataset.armed = '1';
    btn.textContent = 'точно удалить?';
    setTimeout(() => {
      if (!btn.isConnected || !btn.dataset.armed) return;
      delete btn.dataset.armed;
      btn.textContent = 'удалить';
    }, 6000);
    return;
  }
  btn.disabled = true;
  busy(true, 'УДАЛЕНИЕ…');
  try {
    inFlight = true;
    try { await deleteByPath(cur.path, cur.sha); }
    finally { inFlight = false; }
    busy(false);
    toast('✔ УДАЛЕНО — ' + cur.path);
    cur = null;
    await showFiles();
  } catch (e) {
    busy(false);
    btn.disabled = false;
    delete btn.dataset.armed;
    btn.textContent = 'удалить';
    toast('не удалено: ' + e.message, 'err');
  }
}

/* Крестик в списке: та же двухшаговая логика, что и в редакторе. */
async function listDelete(btn){
  const li = btn.closest('li[data-path]');
  const path = li && li.dataset.path;
  if (!path) return;
  if (!btn.dataset.armed) {
    btn.dataset.armed = '1';
    btn.textContent = 'точно удалить?';
    setTimeout(() => {
      if (!btn.isConnected || !btn.dataset.armed) return;
      delete btn.dataset.armed;
      btn.textContent = '✕';
    }, 6000);
    return;
  }
  btn.disabled = true;
  busy(true, 'УДАЛЕНИЕ…');
  try {
    inFlight = true;
    try { await deleteByPath(path, btn.dataset.sha || ''); }
    finally { inFlight = false; }
    busy(false);
    toast('✔ УДАЛЕНО — ' + path);
    await showFiles();
  } catch (e) {
    busy(false);
    btn.disabled = false;
    delete btn.dataset.armed;
    btn.textContent = '✕';
    toast('не удалено: ' + e.message, 'err');
  }
}

window.addEventListener('beforeunload', e => {
  if (cur && cur.dirty) { e.preventDefault(); e.returnValue = ''; }
});

/* ── тестовые крючки (окружение разработки) ──────────────────────────── */

window.__gb3000 = {
  state,
  ver: APP_VER,
  open(obj, path, sha){
    cur = { path: path || 'test/sample.json', sha: sha || 'test',
            data: JSON.parse(JSON.stringify(obj)), dirty: false };
    renderEditor();
  },
  data: () => cur && cur.data,
  serialize: () => cur && serialize(),
  validate: () => cur ? validate() : null,
  entryParts,
  metaFromName,
  buildNew: buildNewProgram,
  startNew: (base, rows) => startNewProgram(base, rows),
  sort: byWorkout,
  todayIso,
  showFiles,
  debugList(rows){
    const sectionsRows = SECTIONS.map(sec => ({
      sec,
      rows: rows.filter(r => String(r.path).startsWith(sec.dir + '/'))
               .map(r => ({ ...r, kind: sec.kind }))
               .sort(byWorkout),
    }));
    renderFiles(sectionsRows, null);
  },
};

/* ── запуск ──────────────────────────────────────────────────────────── */

// Возврат на вкладку: список статичен между действиями, а пользователь мог
// удалить/создать файлы в другой вкладке (или с телефона) — перечитываем.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.token && state.owner &&
      !cur && !inFlight) showFiles();
});

// Пока открыт экран файлов, облако может измениться без нас (телефон, другая
// вкладка) — раз в минуту тихо перечитываем список. Тот же набор защит, что и
// у перечитывания при возврате на вкладку: не редактируем, не ждёт обмен.
setInterval(() => {
  if (document.visibilityState === 'visible' && state.token && state.owner &&
      !cur && !inFlight) showFiles({ quiet: true });
}, 60000);

/* Свежесть бандла: вкладка, открытая до публикации, продолжает работать со
   старым кодом и показывает устаревшее поведение. При каждой загрузке тихо
   сверяем свою версию с живой страницей; не совпала — один раз перезагружаемся
   (флаг в sessionStorage защищает от цикла, если живая версия тоже устареет). */
(async function versionCheck(){
  try {
    const r = await fetch(location.pathname + '?vchk=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/APP_VER = '([^']+)'/);
    if (m && m[1] !== APP_VER && sessionStorage.getItem('gb3000_reloaded') !== m[1]) {
      sessionStorage.setItem('gb3000_reloaded', m[1]);
      location.reload();
    }
  } catch (e) { /* нет связи — работаем как есть */ }
})();

(async function boot(){
  const t = localStorage.getItem(LS_TOKEN);
  if (!t) return showTokenScreen();
  state.token = t;
  busy(true, 'АВТОРИЗАЦИЯ…');
  try {
    state.login = (await api('GET', '/user')).login;
  } catch (e) {
    busy(false);
    return showTokenScreen('сохранённый токен не работает: ' + e.message);
  }
  busy(false);
  await pickRepo();
})();

</script>
